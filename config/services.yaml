# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Authentication type: 'ldap' or 'local'
    app.auth_type: '%env(APP_AUTH_TYPE)%'
    # Local users configuration
    app.local_users: '%env(json:APP_LOCAL_USERS)%'
    # Vérification du certificat du serveur LDAP en LDAPS / StartTLS (never, allow, try, demand, hard)
    app.ldap_tls_require_cert: 'demand'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    Symfony\Component\Ldap\Ldap:
        arguments: ['@Symfony\Component\Ldap\Adapter\ExtLdap\Adapter']
        tags: ['ldap']
    # Adapter LDAP partagé (LdapService et provider security 'ldap_server')
    # LDAP_ENCRYPTION : none (389, dev uniquement), ssl (LDAPS, 636) ou tls (StartTLS, 389)
    Symfony\Component\Ldap\Adapter\ExtLdap\Adapter:
        factory: ['App\Service\LdapAdapterFactory', 'create']
        arguments:
            $host: '%env(LDAP_HOST)%'
            $port: '%env(int:default::LDAP_PORT)%'
            $encryption: '%env(LDAP_ENCRYPTION)%'
            $version: '%env(int:default::LDAP_VERSION)%'
            $caCertFile: '%env(default::LDAP_TLS_CA_CERT_FILE)%'
            $caCertDir: '%env(default::LDAP_TLS_CA_CERT_DIR)%'
            $requireCert: '%env(default:app.ldap_tls_require_cert:LDAP_TLS_REQUIRE_CERT)%'
    App\Service\LdapService:
        bind:
            $ldapBaseSearch: '%env(LDAP_BASE_SEARCH_DN)%'
            $ldapUser: '%env(LDAP_USER_DN)%'
            $ldapPassword: '%env(LDAP_USER_PASSWORD)%'
            $ldapUserKey: '%env(LDAP_USER_KEY)%'

    # Local user provider configuration
    App\Security\LocalUserProvider:
        arguments:
            $users: '%app.local_users%'

