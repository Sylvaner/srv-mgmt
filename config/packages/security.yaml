security:
  # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"
  # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
  providers:
    # LDAP authentication provider
    ldap_server:
      ldap:
        service: Symfony\Component\Ldap\Ldap
        base_dn: "%env(LDAP_BASE_DN)%" # Domaine dans le LDAP
        search_dn: "%env(LDAP_USER_DN)%" # Utilisateur dans l'AD (readonly)
        search_password: "%env(LDAP_USER_PASSWORD)%" # Mot passe de l'utilisateur dans l'AD (readonly)
        uid_key: "%env(LDAP_USER_KEY)%"
        default_roles: ROLE_USER
    # Local user provider
    local_users:
      id: App\Security\LocalUserProvider
    # Provider du renouvellement du token : LDAP ou local selon APP_AUTH_TYPE
    app_auth:
      id: App\Security\AuthModeUserProvider
    # Utilisateur reconstruit à partir du contenu du JWT (identifiant + rôles).
    # Aucun accès LDAP ni base de données à chaque requête de l'API.
    jwt:
      lexik_jwt: ~
  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false
    refresh:
      pattern: ^/api/token/refresh
      stateless: true
      provider: app_auth
      refresh_jwt:
        check_path: /api/token/refresh
    main:
      lazy: true
      # Identique en mode LDAP et en mode local : l'authentification (LDAP ou locale) n'a lieu
      # qu'à la connexion, ensuite le JWT signé fait foi jusqu'à son expiration.
      provider: jwt
      stateless: true
      jwt: ~

      # activate different ways to authenticate
      # https://symfony.com/doc/current/security.html#the-firewall

      # https://symfony.com/doc/current/security/impersonating_user.html
      # switch_user: true

  # Easy way to control access for large sections of your site
  # Note: Only the *first* access control that matches will be used
  access_control:
    - { path: ^/api/login, roles: PUBLIC_ACCESS }
    - { path: ^/api/token/refresh, roles: PUBLIC_ACCESS }
    - { path: ^/api$, roles: PUBLIC_ACCESS }
    - { path: ^/api/*, roles: IS_AUTHENTICATED_FULLY }

when@test:
  security:
    password_hashers:
      # By default, password hashers are resource intensive and take time. This is
      # important to generate secure password hashes. In tests however, secure hashes
      # are not important, waste resources and increase test times. The following
      # reduces the work factor to the lowest possible values.
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4 # Lowest possible value for bcrypt
        time_cost: 3 # Lowest possible value for argon
        memory_cost: 10 # Lowest possible value for argon
